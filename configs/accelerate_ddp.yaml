# accelerate launch --config_file configs/accelerate_ddp.yaml --num_processes N -m watermark_tuner.train.sft ...
# DDP: every rank holds the full bf16 model (~56 GB) + LoRA + activations. Needs >= 80 GB per GPU
# at micro-batch 1; use --liger to fit comfortably. For smaller cards use configs/zero3.json.
compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
mixed_precision: bf16
num_machines: 1
num_processes: 2
machine_rank: 0
main_training_function: main
rdzv_backend: static
same_network: true
use_cpu: false
downcast_bf16: 'no'
gpu_ids: all
