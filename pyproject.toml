[project]
name = "watermark_tuner"
version = "0.1.0"
description = "Fine-tune Qwen3.8-27B on Tinker to rewrite text with an embedded unigram (red/black) watermark for EU AI Act Art. 50 compliance."
requires-python = ">=3.11,<3.14"
dependencies = [
    "tinker>=0.23.0",
    "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git",
    "chz>=0.4.0",
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "torch>=2.10",
    "transformers>=4.57.6,!=5.4.*,!=5.5.0,!=5.5.1,!=5.5.2,!=5.5.3,<=5.5.4",
    "sentence-transformers>=3.0.0",
    "tqdm>=4.60.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
# local / rented GPU training (TRL + PEFT); install vLLM separately to match your CUDA build:
#   uv pip install -e ".[local]" && uv pip install vllm
local = [
    "trl>=1.13.0",
    "peft>=0.21.0",
    "accelerate>=1.0.0",
    "deepspeed>=0.16.0",
    "liger-kernel>=0.5.0",
    "bitsandbytes>=0.45.0",
]

[project.entry-points."vllm.logits_processors"]
wm_red_tilt = "watermark_tuner.vllm_wm:RedTiltLogitsProcessor"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["watermark_tuner*"]
